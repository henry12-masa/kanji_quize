<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字クイズ100問</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Yu Gothic","Hiragino Sans",sans-serif;background:linear-gradient(135deg,#fff7d6,#d7a84f);min-height:100vh;color:#2b1d0e}
.ad-top{position:fixed;top:12px;right:12px;width:300px;height:90px;border:2px dashed #8b5a2b;border-radius:12px;background:white;display:flex;align-items:center;justify-content:center;text-align:center;z-index:10;font-size:14px;color:#6b4a25}
.wrap{max-width:880px;margin:auto;padding:120px 16px 40px}
.game{background:rgba(255,255,255,.96);border:4px solid #8b5a2b;border-radius:24px;padding:26px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.22)}
h1{margin-top:0;font-size:34px}
.menu{display:grid;gap:14px;margin-top:20px}
button{font-size:18px;padding:14px;border:none;border-radius:14px;cursor:pointer;background:#8b5a2b;color:white;font-weight:bold;transition:.15s}
button:hover{transform:scale(1.03);opacity:.95}
.easy{background:#2e8b57}
.normal{background:#1976a3}
.hard{background:#9b3f1f}
.back{background:#555}
.status{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-weight:bold;margin-bottom:18px;background:#fff3d4;border-radius:12px;padding:10px}
.question{font-size:30px;font-weight:bold;background:#fff8e8;border-radius:16px;padding:26px;margin-bottom:20px;line-height:1.6}
.choices{display:grid;gap:12px}
.correct{background:#2e8b57!important}
.wrong{background:#b22222!important}
.result{font-size:22px;font-weight:bold;margin-top:18px;min-height:32px}
.comment{margin-top:12px;font-size:15px;color:#5b4630;line-height:1.6}
.next{margin-top:18px;background:#1f4e79;display:none}
.restart{margin-top:18px;background:#6b3fa0;display:none}
.ad-bottom{margin-top:24px;height:100px;border:2px dashed #8b5a2b;border-radius:14px;background:white;display:flex;justify-content:center;align-items:center;text-align:center;font-size:14px;color:#6b4a25}
.hidden{display:none}
.badge{display:inline-block;background:#fff3d4;border:1px solid #d3a64d;border-radius:999px;padding:6px 12px;margin:4px;font-weight:bold}
@media(max-width:900px){.ad-top{position:static;width:auto;height:70px;margin:12px}.wrap{padding-top:20px}h1{font-size:28px}.question{font-size:26px}button{font-size:16px}}
</style>
</head>

<div class="wrap">
<div class="game">
<h1>🈶 漢字クイズ100問</h1>

<div id="menu">

  <div>
    <span class="badge">初級34問</span>
    <span class="badge">中級33問</span>
    <span class="badge">上級33問</span>
    <span class="badge">合計100問</span>
  </div>
  <div class="menu">
    <button class="easy" onclick="startGame('easy')">初級：かんたんな漢字</button>
    <button class="normal" onclick="startGame('normal')">中級：生活で使う漢字</button>
    <button class="hard" onclick="startGame('hard')">上級：難読漢字</button>
    <button onclick="startGame('all')">全100問ランダム</button>
  </div>
</div>

<div id="quiz" class="hidden">
  <div class="status">
    <div>難易度：<span id="levelName"></span></div>
    <div>問題：<span id="count"></span>/<span id="total"></span></div>
    <div>スコア：<span id="score">0</span></div>
  </div>

  <div class="question" id="question"></div>
  <div class="choices" id="choices"></div>
  <div class="result" id="result"></div>
  <div class="comment" id="comment"></div>

  <button class="next" id="nextBtn" onclick="nextQuestion()">次の問題へ</button>
  <button class="restart" id="restartBtn" onclick="restartGame()">メニューに戻る</button>
</div>

</div>

let currentQuiz = [];
let current = 0;
let score = 0;
let answered = false;

const menu = document.getElementById("menu");
const quiz = document.getElementById("quiz");
const questionEl = document.getElementById("question");
const choicesEl = document.getElementById("choices");
const resultEl = document.getElementById("result");
const commentEl = document.getElementById("comment");
const countEl = document.getElementById("count");
const totalEl = document.getElementById("total");
const scoreEl = document.getElementById("score");
const nextBtn = document.getElementById("nextBtn");
const restartBtn = document.getElementById("restartBtn");
const levelNameEl = document.getElementById("levelName");

function shuffle(arr) {
  return arr.sort(() => Math.random() - 0.5);
}

function startGame(level) {
  if(level === "all") {
    currentQuiz = shuffle([...quizData]);
    levelNameEl.textContent = "全100問";
  } else {
    currentQuiz = shuffle(quizData.filter(x => x.level === level));
    levelNameEl.textContent = level === "easy" ? "初級" : level === "normal" ? "中級" : "上級";
  }

  current = 0;
  score = 0;
  scoreEl.textContent = score;
  totalEl.textContent = currentQuiz.length;

  menu.classList.add("hidden");
  quiz.classList.remove("hidden");
  restartBtn.style.display = "none";

  loadQuestion();
}

function loadQuestion() {
  answered = false;
  resultEl.textContent = "";
  commentEl.textContent = "";
  nextBtn.style.display = "none";
  choicesEl.innerHTML = "";

  const q = currentQuiz[current];
  countEl.textContent = current + 1;
  questionEl.textContent = q.q;

  shuffle([...q.c]).forEach(choice => {
    const btn = document.createElement("button");
    btn.textContent = choice;
    btn.onclick = () => checkAnswer(btn, choice);
    choicesEl.appendChild(btn);
  });
}

function checkAnswer(button, selected) {
  if(answered) return;
  answered = true;

  const q = currentQuiz[current];
  const buttons = choicesEl.querySelectorAll("button");

  buttons.forEach(btn => {
    btn.disabled = true;
    if(btn.textContent === q.a) btn.classList.add("correct");
  });

  if(selected === q.a) {
    score += 10;
    scoreEl.textContent = score;
    resultEl.textContent = "正解！";
  } else {
    button.classList.add("wrong");
    resultEl.textContent = "不正解…";
  }

  commentEl.textContent = q.e;

  if(current < currentQuiz.length - 1) {
    nextBtn.style.display = "inline-block";
  } else {
    finishGame();
  }
}

function nextQuestion() {
  current++;
  loadQuestion();
}

function finishGame() {
  const max = currentQuiz.length * 10;
  const rate = Math.round(score / max * 100);

  questionEl.textContent = "ゲーム終了！";
  choicesEl.innerHTML = "";
  nextBtn.style.display = "none";
  restartBtn.style.display = "inline-block";

  commentEl.textContent = `スコアは ${score}/${max} 点、正答率 ${rate}% です。`;

  if(rate === 100) {
    resultEl.textContent = "🏆 全問正解！漢字博士です！";
  } else if(rate >= 80) {
    resultEl.textContent = "🎉 かなり優秀です！";
  } else if(rate >= 50) {
    resultEl.textContent = "👍 まずまずです！";
  } else {
    resultEl.textContent = "📚 もう一度挑戦して覚えよう！";
  }
}

function restartGame() {
  quiz.classList.add("hidden");
  menu.classList.remove("hidden");
}
